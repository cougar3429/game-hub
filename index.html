<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cougar's Game Hub</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #171c24;
    --panel-hover: #1f2631;
    --line: #2a3240;
    --text: #eef1f5;
    --muted: #8b95a5;
    --accent: #f5a623;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom)); }
  h1 { margin: 8px 0 28px; font-size: 28px; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  h2 { margin: 28px 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  a.card { display: flex; align-items: center; gap: 14px; padding: 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    color: inherit; text-decoration: none; min-height: 76px; }
  a.card:hover, a.card:focus-visible { background: var(--panel-hover); border-color: var(--accent); outline: none; }
  .icon { flex: none; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
    font-size: 24px; background: #232b37; }
  .name { font-size: 17px; font-weight: 600; }
  .sub { margin-top: 3px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Cougar's <span>Game Hub</span></h1>

  <h2>Web Games</h2>
  <div class="grid">
    <a class="card" href="https://cougar3429.github.io/cougars-classic-baseball/">
      <div class="icon">⚾</div>
      <div><div class="name">Cougar's Classic Baseball</div><div class="sub">Play in browser</div></div>
    </a>
    <a class="card" href="https://cougar3429.github.io/cougars-classic-football/">
      <div class="icon">🏈</div>
      <div><div class="name">Cougar's Classic Football</div><div class="sub">Play in browser</div></div>
    </a>
    <a class="card" href="https://claude.ai/artifact/Qwtug97uVCdJenan7KiTfd">
      <div class="icon">📻</div>
      <div><div class="name">GRIDIRON 45</div><div class="sub">Play in browser</div></div>
    </a>
    <a class="card" href="https://ilovefree1s.github.io/game-of-squids/">
      <div class="icon">🦑</div>
      <div><div class="name">Game of Squids</div><div class="sub">Play in browser</div></div>
    </a>
    <a class="card" href="https://cougar3429.github.io/game-hub/spot-the-difference/">
      <div class="icon">👀</div>
      <div><div class="name">Spot the Difference</div><div class="sub">Play in browser</div></div>
    </a>
  </div>

  <h2>Apps</h2>
  <div class="grid">
    <a class="card" href="https://drive.google.com/file/d/1qbg-Ibv6oE3usv2nJfKd1OBVENvqkGUL/view?usp=drive_link">
      <div class="icon">🔐</div>
      <div><div class="name">Cipher Showdown</div><div class="sub">Android download</div></div>
    </a>
  </div>
</main>
</body>
</html>
