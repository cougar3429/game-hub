<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the Difference</title>
<style>
  html,body{margin:0;min-height:100%;background:#111;color:#eee;font-family:system-ui,-apple-system,sans-serif}
  body{display:flex;min-height:100vh}
  .screen{display:none;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:16px;margin:auto}
  .recap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:12px}
  .label{font-size:16px;color:#aaa}
  .screen.on{display:flex}
  .pair{display:flex;gap:10px;justify-content:center}
  .eye{display:flex;flex-direction:column;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:#fff}
  canvas{width:min(44vw,220px);height:min(44vw,220px);border-radius:4px}
  button{font-size:18px;padding:12px 28px;border-radius:8px;border:1px solid #666;background:#222;color:#eee}
  .big{font-size:28px}
  .wrap{position:relative}
  .ans{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(44vw,220px);visibility:hidden}
  .ans button{padding:10px 0;font-size:20px}
  .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;color:#eee}
  .opts{display:flex;flex-direction:column;gap:14px;text-align:left;font-size:18px}
  .opts label{display:flex;align-items:center;gap:10px}
  .opts input{width:22px;height:22px}
  .field{display:flex;align-items:center;gap:10px;font-size:18px}
  .field input[type=text]{font-size:18px;padding:8px 10px;border-radius:8px;border:1px solid #666;background:#222;color:#eee;width:180px}
  .field input[type=range]{width:180px}
  .sub{display:flex;gap:14px;margin-left:32px;font-size:16px;color:#ccc}
  .msg{font-size:15px;color:#aaa;max-width:320px;line-height:1.5}
</style>
</head>
<body>

<div id="start" class="screen on">
  <label class="field">Name <input type="text" id="nameIn" maxlength="20" autocomplete="off"></label>
  <div class="msg">Say or tap how many differences you see in each pair (0 to 5).</div>
  <button id="startBtn">Start</button>
  <label class="field"><input type="checkbox" class="voiceChk" checked style="width:22px;height:22px">Voice</label>
  <button id="optBtn">Options</button>
  <div id="err" class="msg"></div>
</div>

<div id="options" class="screen">
  <div class="big">Differences</div>
  <div class="opts">
    <label><input type="checkbox" name="type" value="color" checked>Color</label>
    <label><input type="checkbox" name="type" value="shape" checked>Shape</label>
    <label><input type="checkbox" name="type" value="size" checked>Size</label>
    <div class="sub">
      <label><input type="radio" name="sizeAmt" value="subtle">Subtle</label>
      <label><input type="radio" name="sizeAmt" value="medium" checked>Medium</label>
      <label><input type="radio" name="sizeAmt" value="obvious">Obvious</label>
    </div>
    <label><input type="checkbox" name="type" value="remove" checked>Missing object</label>
    <label><input type="checkbox" name="type" value="rotate" checked>Rotation</label>
  </div>
  <label class="field"><input type="checkbox" class="voiceChk" checked style="width:22px;height:22px">Voice answers</label>
  <label class="field">Music <input type="range" id="vol" min="0" max="100" step="1" value="70"></label>
  <div id="optErr" class="msg"></div>
  <button id="backBtn">Back</button>
</div>

<div id="play" class="screen">
  <div class="pair">
    <div class="eye"><div class="dot"></div><div class="wrap"><canvas id="L"></canvas><div class="cd"></div></div><div class="ans"><button data-n="0">0</button><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button></div></div>
    <div class="eye"><div class="dot"></div><div class="wrap"><canvas id="R"></canvas><div class="cd"></div></div><div class="ans"><button data-n="0">0</button><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button></div></div>
  </div>
</div>

<div id="done" class="screen">
  <div id="score" class="big"></div>
  <div id="time" class="big"></div>
  <button id="newBtn">New Game</button>
  <button id="menuBtn">Main Menu</button>
  <div id="recap"></div>
</div>

<script>
const PAIRS = 10, MAXD = 5, S = 340;
const C = ["#E24B4A","#378ADD","#639922","#EF9F27","#7F77DD","#D4537E","#1D9E75","#444441"];
const T = ["circle","square","tri","star","ring"];
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];

function gen(){
  const s=[]; let tries=0;
  while(s.length<16 && tries<500){ tries++;
    const r=rnd(14,30), x=rnd(r+6,S-r-6), y=rnd(r+6,S-r-6);
    if(s.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+8)) s.push({x,y,r,c:pick(C),t:pick(T),a:rnd(0,6.28)});
  }
  return s;
}
function shape(g,o){
  g.fillStyle=o.c; g.strokeStyle=o.c; g.lineWidth=6;
  g.save(); g.translate(o.x,o.y); g.rotate(o.a); g.beginPath();
  const r=o.r;
  if(o.t==="circle"){ g.arc(0,0,r,0,7); g.fill(); }
  else if(o.t==="ring"){ g.arc(0,0,r-3,0,7); g.stroke(); }
  else if(o.t==="square"){ g.fillRect(-r*.85,-r*.85,r*1.7,r*1.7); }
  else if(o.t==="tri"){ g.moveTo(0,-r); g.lineTo(r*.95,r*.75); g.lineTo(-r*.95,r*.75); g.closePath(); g.fill(); }
  else { for(let i=0;i<10;i++){ const rr=i%2?r*.45:r, an=i*Math.PI/5-Math.PI/2; g.lineTo(Math.cos(an)*rr,Math.sin(an)*rr); } g.closePath(); g.fill(); }
  g.restore();
}
function draw(id,s,marks){
  const cv=typeof id==="string"?document.getElementById(id):id, dpr=window.devicePixelRatio||1, w=cv.clientWidth;
  cv.width=w*dpr; cv.height=w*dpr;
  const g=cv.getContext("2d"); g.setTransform(w*dpr/S,0,0,w*dpr/S,0,0);
  g.fillStyle="#F1EFE8"; g.fillRect(0,0,S,S); s.forEach(o=>shape(g,o));
  if(marks){ g.strokeStyle="#000"; g.lineWidth=4; marks.forEach(m=>{ g.beginPath(); g.arc(m.x,m.y,m.r+8,0,7); g.stroke(); }); }
}
const TRACKS = ["music/do-you-feel-it-too.mp3","music/the-lounge.mp3","music/be-with-you-eternal-mix.mp3","music/transcend-the-universe.mp3"];
const music = new Audio();
let fadeId=0;
function playRandom(){ fadeId++; music.volume=document.getElementById("vol").value/100; music.src=pick(TRACKS); music.play().catch(()=>{}); }
function fadeOut(ms){
  const id=++fadeId, v0=music.volume, t0=performance.now();
  (function step(){
    if(id!==fadeId) return;
    const k=Math.min(1,(performance.now()-t0)/ms);
    music.volume=v0*(1-k);
    if(k<1) requestAnimationFrame(step); else music.pause();
  })();
}
let actx=null;
function beep(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
  o.type="sine"; o.frequency.value=880;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.16);
}
function ding(){
  if(!actx) return 0;
  const t0=actx.currentTime+0.05;
  const comp=actx.createDynamicsCompressor(); comp.connect(actx.destination);
  const master=actx.createGain(); master.gain.value=0.9; master.connect(comp);
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function brass(m,start,dur,amp){
    const lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.Q.value=1;
    lp.frequency.setValueAtTime(600,start); lp.frequency.linearRampToValueAtTime(4000,start+0.06); lp.frequency.exponentialRampToValueAtTime(1800,start+dur);
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001,start); g.gain.exponentialRampToValueAtTime(amp,start+0.03);
    g.gain.setValueAtTime(amp,start+dur*0.7); g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
    lp.connect(g); g.connect(master);
    [-6,6].forEach(det=>{
      const o=actx.createOscillator(); o.type="sawtooth"; o.frequency.value=hz(m); o.detune.value=det;
      const vib=actx.createOscillator(), vg=actx.createGain(); vib.frequency.value=5.5; vg.gain.value=dur>0.5?6:0;
      vib.connect(vg); vg.connect(o.detune); vib.start(start); vib.stop(start+dur+0.05);
      o.connect(lp); o.start(start); o.stop(start+dur+0.05);
    });
  }
  function bell(m,start){
    [[1,0.25,2.2],[2.76,0.08,1.2],[5.4,0.04,0.6]].forEach(([k,amp,dec])=>{
      const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=hz(m)*k;
      g.gain.setValueAtTime(0.0001,start); g.gain.exponentialRampToValueAtTime(amp,start+0.005); g.gain.exponentialRampToValueAtTime(0.0001,start+dec);
      o.connect(g); g.connect(master); o.start(start); o.stop(start+dec+0.05);
    });
  }
  const step=0.13;
  [60,64,67,72].forEach((m,i)=>brass(m,t0+i*step,step*1.1,0.22));
  brass(67,t0+4*step,step*0.9,0.22);
  const tc=t0+5*step;
  [60,64,67,72,76].forEach(m=>brass(m,tc,1.6,0.16));
  brass(48,tc,1.6,0.18);
  bell(84,tc); bell(88,tc+0.02);
  return Math.round((5*step+1.7)*1000);
}
function menuMusic(){ if(!running && music.paused) playRandom(); }
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,e=>{ if(e.target.id!=="startBtn") menuMusic(); }));
music.addEventListener("ended", playRandom);
function store(k,v){ try{ localStorage.setItem("std_"+k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ const v=localStorage.getItem("std_"+k); return v===null?null:JSON.parse(v); }catch(e){ return null; } }

const SIZES = {subtle:{shrink:.8,grow:1.25}, medium:{shrink:.6,grow:1.5}, obvious:{shrink:.45,grow:1.9}};
const ROT = {square:Math.PI/4, tri:Math.PI/3, star:Math.PI/5};

function getOpts(){
  return {
    types:[...document.querySelectorAll('input[name="type"]:checked')].map(i=>i.value),
    size:document.querySelector('input[name="sizeAmt"]:checked').value
  };
}
function fits(x,y,r,others){
  if(x-r<4||y-r<4||x+r>S-4||y+r>S-4) return false;
  return others.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+4);
}
function makePair(opts){
  const a=gen(), b=a.map(o=>({...o}));
  const n=Math.floor(Math.random()*(MAXD+1));
  const used=new Set(), del=[], marks=[];
  let made=0, guard=0;
  while(made<n && guard<200){ guard++;
    const k=pick(opts.types);
    const free=[...b.keys()].filter(i=>!used.has(i) && (k!=="rotate" || ROT[b[i].t]));
    if(!free.length) continue;
    const i=pick(free), o=b[i];
    if(k==="color") o.c=pick(C.filter(c=>c!==o.c));
    else if(k==="shape") o.t=pick(T.filter(t=>t!==o.t));
    else if(k==="size"){
      const f=SIZES[opts.size], g=o.r*f.grow;
      if(o.r<=22 && fits(o.x,o.y,g,a.filter((q,j)=>j!==i))) o.r=g; else o.r*=f.shrink;
    }
    else if(k==="rotate") o.a+=ROT[o.t];
    else del.push(i);
    used.add(i); marks.push({x:o.x,y:o.y,r:Math.max(o.r,a[i].r)}); made++;
  }
  return {left:a, right:b.filter((o,i)=>!del.includes(i)), count:made, marks};
}

const WORDS = {zero:0,"0":0,one:1,won:1,"1":1,two:2,to:2,too:2,"2":2,three:3,"3":3,four:4,for:4,"4":4,five:5,"5":5};
function parseNum(text){
  for(const w of text.toLowerCase().split(/[^a-z0-9]+/)) if(w in WORDS) return WORDS[w];
  return null;
}

let pairs=[], answers=[], cur=0, correct=0, t0=0, running=false, ready=false, rec=null, consumed=-1;
const ALIGN_MS=2000;

function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id)); window.scrollTo(0,0); }
function showPair(){ draw("L",pairs[cur].left); draw("R",pairs[cur].right); }
window.addEventListener("resize",()=>{ if(running && ready && cur<PAIRS) showPair(); else if(!running && cur>=PAIRS) drawRecap(); });

function answer(n){
  beep();
  answers[cur]=n;
  if(n===pairs[cur].count) correct++;
  cur++;
  if(cur>=PAIRS) return finish();
  showPair();
}
function finish(){
  running=false;
  const secs=(performance.now()-t0)/1000;
  try{ if(rec) rec.abort(); }catch(e){}
  document.getElementById("score").textContent=correct+" of "+PAIRS+" correct";
  document.getElementById("time").textContent=secs.toFixed(1)+" seconds";
  buildRecap();
  show("done");
  if(correct===PAIRS){ const ms=ding(); setTimeout(()=>{ if(!running && music.paused) playRandom(); }, ms); }
  else playRandom();
  drawRecap();
}
function buildRecap(){
  const box=document.getElementById("recap"); box.innerHTML="";
  pairs.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="recap";
    d.innerHTML='<div class="label">Pair '+(i+1)+': you said '+answers[i]+', actual '+p.count+'</div>'+
      '<div class="pair"><div class="eye"><div class="dot"></div><canvas></canvas></div><div class="eye"><div class="dot"></div><canvas></canvas></div></div>';
    box.appendChild(d);
  });
}
function drawRecap(){
  document.querySelectorAll("#recap .recap").forEach((d,i)=>{
    const c=d.querySelectorAll("canvas");
    draw(c[0],pairs[i].left,pairs[i].marks); draw(c[1],pairs[i].right,pairs[i].marks);
  });
}

function startRec(){
  consumed=-1;
  try{ rec.start(); }catch(e){}
}

function voiceOn(){ return document.querySelector(".voiceChk").checked; }
function micCheck(){
  if(!voiceOn() || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return;
  navigator.mediaDevices.getUserMedia({audio:true})
    .then(stream=>stream.getTracks().forEach(t=>t.stop()))
    .catch(e=>{ document.getElementById("err").textContent="Microphone error: "+e.name; });
}

(function restore(){
  const name=load("name"); if(name!==null) document.getElementById("nameIn").value=name;
  const vol=load("vol"); if(vol!==null) document.getElementById("vol").value=vol;
  const types=load("types");
  const valid=types?[...document.querySelectorAll('input[name="type"]')].filter(i=>types.includes(i.value)):[];
  if(valid.length) document.querySelectorAll('input[name="type"]').forEach(i=>i.checked=types.includes(i.value));
  const voice=load("voice"); if(voice!==null) document.querySelectorAll(".voiceChk").forEach(c=>c.checked=voice);
  const size=load("size"); if(size){ const r=document.querySelector('input[name="sizeAmt"][value="'+size+'"]'); if(r) r.checked=true; }
})();
function saveOpts(){ const o=getOpts(); if(o.types.length) store("types",o.types); store("size",o.size); }
document.querySelectorAll('input[name="type"],input[name="sizeAmt"]').forEach(i=>i.addEventListener("change",saveOpts));
document.getElementById("nameIn").addEventListener("input",e=>store("name",e.target.value));
document.getElementById("vol").addEventListener("input",e=>{ store("vol",+e.target.value); if(!running) music.volume=e.target.value/100; });
music.volume=document.getElementById("vol").value/100;
document.querySelectorAll(".voiceChk").forEach(c=>c.addEventListener("change",()=>{
  document.querySelectorAll(".voiceChk").forEach(o=>o.checked=c.checked);
  store("voice",c.checked);
  document.getElementById("err").textContent="";
  micCheck();
}));
micCheck();

document.getElementById("optBtn").onclick=()=>{ document.getElementById("optErr").textContent=""; show("options"); };
document.getElementById("backBtn").onclick=()=>{
  if(!getOpts().types.length){ document.getElementById("optErr").textContent="Pick at least one difference type."; return; }
  show("start");
};
document.querySelectorAll('input[name="type"]').forEach(i=>i.onchange=()=>{ document.getElementById("optErr").textContent=""; });

document.querySelectorAll("#play .ans button").forEach(b=>b.onclick=()=>{ if(running && ready) answer(+b.dataset.n); });
document.getElementById("menuBtn").onclick=()=>{ document.getElementById("err").textContent=""; show("start"); };
document.getElementById("newBtn").onclick=()=>startGame();
document.getElementById("startBtn").onclick=()=>startGame();
function startGame(){
  const opts=getOpts();
  const voice=voiceOn();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(voice && !SR){ document.getElementById("err").textContent="Speech recognition isn't available in this browser. Use Chrome on Android or Safari on iPhone, or turn off Voice."; return; }
  fadeOut(500);
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
  rec=null;
  if(voice){
  rec=new SR();
  rec.lang="en-US"; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    if(!running) return;
    if(!ready){ consumed=e.results.length-1; return; }
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(i<=consumed) continue;
      const n=parseNum(e.results[i][0].transcript);
      if(n!==null){ consumed=i; answer(n); if(!running) return; }
    }
  };
  rec.onend=()=>{ if(running) startRec(); };
  rec.onerror=e=>{
    if(e.error!=="no-speech"&&e.error!=="aborted"){
      running=false; show("start"); menuMusic();
      document.getElementById("err").textContent="Speech recognition error: "+e.error;
    }
  };
  }
  pairs=Array.from({length:PAIRS},()=>makePair(opts));
  answers=[]; cur=0; correct=0; running=true; ready=false;
  const cvs=[document.getElementById("L"),document.getElementById("R")];
  const ansRows=document.querySelectorAll("#play .ans");
  cvs.forEach(c=>c.style.visibility="hidden");
  ansRows.forEach(r=>r.style.visibility="hidden");
  show("play");
  if(rec) startRec();
  const cds=document.querySelectorAll("#play .cd"), step=ALIGN_MS/3;
  const setCd=t=>cds.forEach(d=>d.textContent=t);
  setCd("2");
  setTimeout(()=>{ if(running) setCd("1"); }, step);
  setTimeout(()=>{ if(running) setCd("Go!"); }, step*2);
  setTimeout(()=>{
    setCd("");
    if(!running) return;
    showPair();
    cvs.forEach(c=>c.style.visibility="visible");
    ansRows.forEach(r=>r.style.visibility="visible");
    ready=true;
    t0=performance.now();
  },ALIGN_MS);
}
</script>
</body>
</html>
