<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the Difference</title>
<style>
  html,body{margin:0;min-height:100%;background:#111;color:#eee;font-family:system-ui,-apple-system,sans-serif}
  body{display:flex;min-height:100vh}
  .screen{display:none;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:16px;margin:auto}
  .recap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:12px}
  .label{font-size:16px;color:#aaa}
  .screen.on{display:flex}
  .pair{display:flex;gap:10px;justify-content:center}
  .eye{display:flex;flex-direction:column;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:#fff}
  :root{--pic:220px}
  canvas{width:min(44vw,var(--pic));height:min(44vw,var(--pic));border-radius:4px}
  .sizer{display:flex;flex-direction:column;align-items:stretch;width:min(92vw,360px)}
  .sizer .top{display:flex;align-items:center;gap:8px;font-size:15px;color:#ccc}
  .sizer input{flex:1;margin:0}
  .sizer .ticks{display:flex;justify-content:space-between;font-size:11px;color:#888;padding:0 6px 0 46px}
  #play .sizer{margin-top:auto;padding-bottom:6px}
  body.speedPlay #bigAns{display:none}
  #play .sizer .top{font-size:12px}
  button{font-size:18px;padding:12px 28px;border-radius:8px;border:1px solid #666;background:#222;color:#eee}
  .big{font-size:28px}
  .wrap{position:relative}
  .logo{line-height:1;margin-bottom:12px;font-weight:900;letter-spacing:.04em}
  .logo .l1{font-size:26px;color:#F1EFE8}
  .logo .l2{font-size:44px;color:#EF9F27}
  .logo .odd{color:#378ADD}
  .modes{display:flex;gap:0}
  .modes button{border-radius:0;min-width:110px}
  .modes button:first-child{border-radius:8px 0 0 8px}
  .modes button:last-child{border-radius:0 8px 8px 0}
  .modes button.sel{background:#EF9F27;color:#111;border-color:#EF9F27;font-weight:700}
  .hdr{font-size:36px;font-weight:800;margin-bottom:4px}
  #play{margin:0;width:100%;box-sizing:border-box;min-height:100vh;min-height:100dvh;justify-content:flex-start}
  #bigAns{flex:1;width:100%;display:grid;grid-template-columns:repeat(2,auto);grid-template-rows:repeat(3,auto);padding-left:8px;padding-right:8px;justify-content:space-between;align-content:space-evenly;padding-top:12px;padding-bottom:12px;box-sizing:border-box;visibility:hidden}
  #bigAns button{width:84px;height:84px;padding:0;font-size:38px;font-weight:600;background:#C62828;border:none;color:#fff;border-radius:14px}
  #bigAns button[data-n="0"]{background:#D32F2F}
  #bigAns button[data-n="1"]{background:#EF6C00}
  #bigAns button[data-n="2"]{background:#E6B800}
  #bigAns button[data-n="3"]{background:#2E7D32}
  #bigAns button[data-n="4"]{background:#1565C0}
  #bigAns button[data-n="5"]{background:#7B1FA2}
  @media (orientation:landscape){
    canvas{width:min(44vw,var(--pic),calc(100vh - 190px));height:min(44vw,var(--pic),calc(100vh - 190px))}
    body.speedPlay canvas{width:min(44vw,var(--pic),calc(100vh - 100px));height:min(44vw,var(--pic),calc(100vh - 100px))}
    #bigAns button{width:64px;height:64px;font-size:30px}
    #play .sizer{padding-bottom:2px}
  }
  @media (orientation:landscape){ #bigAns{grid-template-columns:repeat(6,auto);grid-template-rows:auto;padding-left:8px;padding-right:8px} }
  .cd{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:48px;color:#eee}
  .opts{display:flex;flex-direction:column;gap:14px;text-align:left;font-size:18px}
  .opts label{display:flex;align-items:center;gap:10px}
  .opts input{width:22px;height:22px}
  .field{display:flex;align-items:center;gap:10px;font-size:18px}
  .field input[type=text]{font-size:18px;padding:8px 10px;border-radius:8px;border:1px solid #666;background:#222;color:#eee;width:180px}
  .field input[type=range]{width:180px}
  .msg{font-size:15px;color:#aaa;max-width:320px;line-height:1.5}
</style>
</head>
<body>

<div id="start" class="screen on">
  <div class="logo"><div class="l1">SPOT THE</div><div class="l2">DIFF<span class="odd">E</span>RENCE</div></div>
  <div style="font-size:13px;color:#888;margin-top:-10px">v1.0</div>
  <label class="field">Name <input type="text" id="nameIn" maxlength="20" autocomplete="off"></label>
  <div class="modes"><button id="modeClassic">Classic</button><button id="modeSpeed">Speed</button></div>
  <div class="msg" id="howTo"></div>
  <button id="startBtn">Start</button>
  <label class="field"><input type="checkbox" class="voiceChk" checked style="width:22px;height:22px">Voice</label>
  <button id="optBtn">Options</button>
  <div id="err" class="msg"></div>
</div>

<div id="options" class="screen">
  <div class="hdr">Options</div>
  <div class="big">Differences</div>
  <div class="opts">
    <label><input type="checkbox" id="allChk" checked>All</label>
    <label><input type="checkbox" name="type" value="color" checked>Color</label>
    <label><input type="checkbox" name="type" value="shape" checked>Shape</label>
    <label><input type="checkbox" name="type" value="size" checked>Size</label>
    <label><input type="checkbox" name="type" value="remove" checked>Missing object</label>
    <label><input type="checkbox" name="type" value="rotate" checked>Rotation</label>
  </div>
  <label class="field"><input type="checkbox" class="voiceChk" checked style="width:22px;height:22px">Voice answers</label>
  <label class="field"><input type="checkbox" id="btnChk" checked style="width:22px;height:22px">Answer buttons</label>
  <label class="field">Music <input type="range" id="vol" min="0" max="100" step="1" value="70"></label>
  <div class="sizer"><div class="top"><span>Size</span><input type="range" class="sizeSl" min="1" max="10" step="1"></div><div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div></div>
  <div id="optErr" class="msg"></div>
  <button id="backBtn">Back</button>
</div>

<div id="play" class="screen">
  <div class="pair">
    <div class="eye"><div class="dot"></div><div class="wrap"><canvas id="L"></canvas><div class="cd"></div></div></div>
    <div class="eye"><div class="dot"></div><div class="wrap"><canvas id="R"></canvas><div class="cd"></div></div></div>
  </div>
  <div id="bigAns"><button data-n="0">0</button><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button></div>
  <div class="sizer"><div class="top"><span>Size</span><input type="range" class="sizeSl" min="1" max="10" step="1"></div><div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div></div>
</div>

<div id="done" class="screen">
  <div id="score" class="big"></div>
  <div id="time" class="big"></div>
  <button id="newBtn">New Game</button>
  <button id="menuBtn">Main Menu</button>
  <div id="recap"></div>
</div>

<script>
const PAIRS = 10, MAXD = 5, S = 340;
const C = ["#E24B4A","#378ADD","#639922","#EF9F27","#7F77DD","#D4537E","#1D9E75","#444441"];
const T = ["circle","square","tri","star","ring"];
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];

function gen(){
  const s=[]; let tries=0;
  while(s.length<16 && tries<500){ tries++;
    const r=rnd(14,30), x=rnd(r+6,S-r-6), y=rnd(r+6,S-r-6);
    if(s.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+8)) s.push({x,y,r,c:pick(C),t:pick(T),a:rnd(0,6.28)});
  }
  return s;
}
function shape(g,o){
  g.fillStyle=o.c; g.strokeStyle=o.c; g.lineWidth=6;
  g.save(); g.translate(o.x,o.y); g.rotate(o.a); g.beginPath();
  const r=o.r;
  if(o.t==="circle"){ g.arc(0,0,r,0,7); g.fill(); }
  else if(o.t==="ring"){ g.arc(0,0,r-3,0,7); g.stroke(); }
  else if(o.t==="square"){ g.fillRect(-r*.85,-r*.85,r*1.7,r*1.7); }
  else if(o.t==="tri"){ g.moveTo(0,-r); g.lineTo(r*.95,r*.75); g.lineTo(-r*.95,r*.75); g.closePath(); g.fill(); }
  else { for(let i=0;i<10;i++){ const rr=i%2?r*.45:r, an=i*Math.PI/5-Math.PI/2; g.lineTo(Math.cos(an)*rr,Math.sin(an)*rr); } g.closePath(); g.fill(); }
  g.restore();
}
function draw(id,s,marks,miss){
  const cv=typeof id==="string"?document.getElementById(id):id, dpr=window.devicePixelRatio||1, w=cv.clientWidth;
  cv.width=w*dpr; cv.height=w*dpr;
  const g=cv.getContext("2d"); g.setTransform(w*dpr/S,0,0,w*dpr/S,0,0);
  g.fillStyle="#F1EFE8"; g.fillRect(0,0,S,S); s.forEach(o=>shape(g,o));
  if(marks){ g.strokeStyle="#000"; g.lineWidth=6; marks.forEach(m=>{ g.beginPath(); g.arc(m.x,m.y,m.r+8,0,7); g.stroke(); }); }
  if(miss){
    const R=14, d=R*Math.SQRT1_2;
    g.strokeStyle="#E00000"; g.lineCap="round";
    g.lineWidth=6; g.beginPath(); g.arc(miss.x,miss.y,R,0,7); g.stroke();
    g.lineWidth=4; g.beginPath();
    g.moveTo(miss.x-d,miss.y-d); g.lineTo(miss.x+d,miss.y+d);
    g.moveTo(miss.x+d,miss.y-d); g.lineTo(miss.x-d,miss.y+d); g.stroke();
    g.lineCap="butt";
  }
}
const TRACKS = ["music/do-you-feel-it-too.mp3","music/the-lounge.mp3","music/be-with-you-eternal-mix.mp3","music/transcend-the-universe.mp3"];
const music = new Audio();
const FADE_MS=1000;
let actx=null, musicGain=null, fadeTimer=null;
function ensureAudio(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(!musicGain){ musicGain=actx.createGain(); actx.createMediaElementSource(music).connect(musicGain); musicGain.connect(actx.destination); }
    actx.resume();
  }catch(e){}
}
function sliderVol(){ return document.getElementById("vol").value/100; }
function setMusicVol(v){
  if(musicGain){ const t=actx.currentTime; musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(v,t); music.volume=1; }
  else music.volume=v;
}
function playRandom(){ clearTimeout(fadeTimer); setMusicVol(sliderVol()); music.src=pick(TRACKS); music.play().catch(()=>{}); }
function fadeOut(ms){
  clearTimeout(fadeTimer);
  if(musicGain){
    const t=actx.currentTime, g=musicGain.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(0,t+ms/1000);
  } else music.volume=0;
  fadeTimer=setTimeout(()=>music.pause(), ms);
}

function beep(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
  o.type="sine"; o.frequency.value=880;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.16);
}
const dingSnd = new Audio("sounds/level-ding.mp3"); dingSnd.preload="auto";
function ding(done){
  let finished=false; const end=()=>{ if(!finished){ finished=true; done(); } };
  dingSnd.onended=end;
  dingSnd.currentTime=0;
  dingSnd.play().catch(end);
}
function menuMusic(){ if(!running && music.paused){ ensureAudio(); playRandom(); } }
function goFull(){
  const el=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement) return;
  try{ const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:"hide"}); if(r&&r.catch) r.catch(()=>{}); }catch(e){}
}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,e=>{ goFull(); if(e.target.id!=="startBtn") menuMusic(); }));
music.addEventListener("ended", playRandom);
function store(k,v){ try{ localStorage.setItem("std_"+k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ const v=localStorage.getItem("std_"+k); return v===null?null:JSON.parse(v); }catch(e){ return null; } }

const SIZE = {shrink:.55, grow:1.6};
const ROT = {square:Math.PI/4, tri:Math.PI/3, star:Math.PI/5};

function getOpts(){
  return {
    types:[...document.querySelectorAll('input[name="type"]:checked')].map(i=>i.value)
  };
}
function fits(x,y,r,others){
  if(x-r<4||y-r<4||x+r>S-4||y+r>S-4) return false;
  return others.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+4);
}
function makePair(opts, forceN){
  const a=gen(), b=a.map(o=>({...o}));
  const n=forceN!==undefined?forceN:Math.floor(Math.random()*(MAXD+1));
  const used=new Set(), del=[], marks=[];
  let made=0, guard=0;
  while(made<n && guard<200){ guard++;
    const k=pick(opts.types);
    const free=[...b.keys()].filter(i=>!used.has(i) && (k!=="rotate" || ROT[b[i].t]));
    if(!free.length) continue;
    const i=pick(free), o=b[i];
    if(k==="color") o.c=pick(C.filter(c=>c!==o.c));
    else if(k==="shape") o.t=pick(T.filter(t=>t!==o.t));
    else if(k==="size"){
      const f=SIZE, g=o.r*f.grow;
      if(o.r<=22 && fits(o.x,o.y,g,a.filter((q,j)=>j!==i))) o.r=g; else o.r*=f.shrink;
    }
    else if(k==="rotate") o.a+=ROT[o.t];
    else del.push(i);
    used.add(i); marks.push({x:o.x,y:o.y,r:Math.max(o.r,a[i].r)}); made++;
  }
  return {left:a, right:b.filter((o,i)=>!del.includes(i)), count:made, marks};
}

const WORDS = {zero:0,"0":0,one:1,won:1,"1":1,two:2,to:2,too:2,"2":2,three:3,"3":3,four:4,for:4,"4":4,five:5,"5":5};
function parseNum(text){
  for(const w of text.toLowerCase().split(/[^a-z0-9]+/)) if(w in WORDS) return WORDS[w];
  return null;
}

let pairs=[], answers=[], cur=0, correct=0, t0=0, running=false, ready=false, rec=null, consumed=-1;
const ALIGN_MS=2000;

const SIZE_PX=v=>120+(v-1)*25;
const landMQ=window.matchMedia("(orientation: landscape)");
function curSize(){ const v=load("picSize"); return v!==null?v:5; }
function applySize(redraw){
  const v=curSize();
  document.documentElement.style.setProperty("--pic",SIZE_PX(v)+"px");
  document.querySelectorAll(".sizeSl").forEach(sl=>sl.value=v);
  if(redraw){ if(running && ready && cur<PAIRS) showPair(); else if(!running && cur>=PAIRS && pairs.length) drawRecap(); }
}
document.querySelectorAll(".sizeSl").forEach(sl=>sl.addEventListener("input",()=>{ store("picSize",+sl.value); applySize(true); }));
landMQ.addEventListener("change",()=>applySize(true));
applySize(false);
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id)); window.scrollTo(0,0); }
function showPair(){ draw("L",pairs[cur].left); draw("R",pairs[cur].right); }
window.addEventListener("resize",()=>{ if(running && ready && cur<PAIRS) showPair(); else if(!running && cur>=PAIRS) drawRecap(); });

function answer(n){
  beep();
  answers[cur]=n;
  if(n===pairs[cur].count) correct++;
  cur++;
  if(cur>=PAIRS) return finish();
  showPair();
}
let taps=[];
function tapAnswer(hit,x,y){
  beep();
  answers[cur]=hit;
  taps[cur]={x,y};
  if(hit) correct++;
  cur++;
  if(cur>=PAIRS) return finish();
  showPair();
}
["L","R"].forEach(id=>{
  const cv=document.getElementById(id);
  cv.addEventListener("pointerdown",e=>{
    if(!running || !ready || gameMode!=="speed") return;
    const rect=cv.getBoundingClientRect(), k=S/rect.width;
    const x=(e.clientX-rect.left)*k, y=(e.clientY-rect.top)*k;
    const m=pairs[cur].marks[0], pad=TAP_PAD_PX*k;
    tapAnswer(Math.hypot(x-m.x,y-m.y)<=m.r+pad, x, y);
  });
});
function finish(){
  running=false;
  const secs=(performance.now()-t0)/1000;
  try{ if(rec) rec.abort(); }catch(e){}
  document.getElementById("score").textContent=correct+" of "+PAIRS+" correct";
  document.getElementById("time").textContent=secs.toFixed(1)+" seconds";
  buildRecap();
  show("done");
  if(music.paused) playRandom();
  if(correct===PAIRS) ding(()=>{});
  drawRecap();
}
function buildRecap(){
  const box=document.getElementById("recap"); box.innerHTML="";
  pairs.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="recap";
    const label=gameMode==="speed"?(answers[i]?"correct":"missed"):"you said "+answers[i]+", actual "+p.count;
    d.innerHTML='<div class="label">Pair '+(i+1)+': '+label+'</div>'+
      '<div class="pair"><div class="eye"><div class="dot"></div><canvas></canvas></div><div class="eye"><div class="dot"></div><canvas></canvas></div></div>';
    box.appendChild(d);
  });
}
function drawRecap(){
  document.querySelectorAll("#recap .recap").forEach((d,i)=>{
    const c=d.querySelectorAll("canvas");
    const miss=(gameMode==="speed" && !answers[i]) ? taps[i] : null;
    draw(c[0],pairs[i].left,pairs[i].marks,miss); draw(c[1],pairs[i].right,pairs[i].marks,miss);
  });
}

function startRec(){
  consumed=-1;
  try{ rec.start(); }catch(e){}
}

function voiceOn(){ return document.querySelector(".voiceChk").checked; }
function micCheck(){
  if(!voiceOn() || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return;
  navigator.mediaDevices.getUserMedia({audio:true})
    .then(stream=>stream.getTracks().forEach(t=>t.stop()))
    .catch(e=>{ document.getElementById("err").textContent="Microphone error: "+e.name; });
}

(function restore(){
  const name=load("name"); if(name!==null) document.getElementById("nameIn").value=name;
  const vol=load("vol"); if(vol!==null) document.getElementById("vol").value=vol;
  const types=load("types");
  const valid=types?[...document.querySelectorAll('input[name="type"]')].filter(i=>types.includes(i.value)):[];
  if(valid.length) document.querySelectorAll('input[name="type"]').forEach(i=>i.checked=types.includes(i.value));
  const voice=load("voice"); if(voice!==null) document.querySelectorAll(".voiceChk").forEach(c=>c.checked=voice);
})();
function saveOpts(){ const o=getOpts(); if(o.types.length) store("types",o.types); }
const typeBoxes=[...document.querySelectorAll('input[name="type"]')], allChk=document.getElementById("allChk");
function syncAll(){ allChk.checked=typeBoxes.every(b=>b.checked); }
typeBoxes.forEach(i=>i.addEventListener("change",()=>{ syncAll(); saveOpts(); }));
allChk.addEventListener("change",()=>{ typeBoxes.forEach(b=>b.checked=allChk.checked); document.getElementById("optErr").textContent=""; saveOpts(); });
syncAll();
document.getElementById("nameIn").addEventListener("input",e=>store("name",e.target.value));
document.getElementById("vol").addEventListener("input",e=>{ store("vol",+e.target.value); if(!running) setMusicVol(e.target.value/100); });
music.volume=sliderVol();
document.querySelectorAll(".voiceChk").forEach(c=>c.addEventListener("change",()=>{
  document.querySelectorAll(".voiceChk").forEach(o=>o.checked=c.checked);
  store("voice",c.checked);
  document.getElementById("err").textContent="";
  micCheck();
}));
micCheck();

document.getElementById("optBtn").onclick=()=>{ document.getElementById("optErr").textContent=""; show("options"); };
const btnChk=document.getElementById("btnChk");
{ const v=load("buttons"); if(v!==null) btnChk.checked=v; }
btnChk.addEventListener("change",()=>{ store("buttons",btnChk.checked); document.getElementById("optErr").textContent=""; });
const NO_INPUT="Turn on Voice or answer buttons.";
document.getElementById("backBtn").onclick=()=>{
  if(!getOpts().types.length){ document.getElementById("optErr").textContent="Pick at least one difference type."; return; }
  if(!voiceOn() && !btnChk.checked){ document.getElementById("optErr").textContent=NO_INPUT; return; }
  show("start");
};
document.querySelectorAll('input[name="type"]').forEach(i=>i.onchange=()=>{ document.getElementById("optErr").textContent=""; });

document.querySelectorAll("#bigAns button").forEach(b=>b.onclick=()=>{ if(running && ready) answer(+b.dataset.n); });
document.getElementById("menuBtn").onclick=()=>{ document.getElementById("err").textContent=""; show("start"); };
document.getElementById("newBtn").onclick=()=>startGame();
document.getElementById("startBtn").onclick=()=>startGame();
const TAP_PAD_PX=20;
let mode=load("mode")==="speed"?"speed":"classic", gameMode=mode;
const HOWTO={classic:"Say or tap how many differences you see in each pair (0 to 5).", speed:"Each pair has one difference. Tap it on either picture."};
function setMode(m){
  mode=m; store("mode",m);
  document.getElementById("modeClassic").classList.toggle("sel",m==="classic");
  document.getElementById("modeSpeed").classList.toggle("sel",m==="speed");
  document.getElementById("howTo").textContent=HOWTO[m];
  document.getElementById("err").textContent="";
}
document.getElementById("modeClassic").onclick=()=>setMode("classic");
document.getElementById("modeSpeed").onclick=()=>setMode("speed");
setMode(mode);
function startGame(){
  const opts=getOpts();
  gameMode=mode;
  const speed=gameMode==="speed";
  const voice=!speed && voiceOn();
  if(!speed && !voice && !btnChk.checked){ document.getElementById("err").textContent=NO_INPUT; return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(voice && !SR){ document.getElementById("err").textContent="Speech recognition isn't available in this browser. Use Chrome on Android or Safari on iPhone, or turn off Voice."; return; }
  ensureAudio();
  if(!speed) fadeOut(FADE_MS);
  else if(music.paused) playRandom();
  dingSnd.pause();
  rec=null;
  if(voice){
  rec=new SR();
  rec.lang="en-US"; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    if(!running) return;
    if(!ready){ consumed=e.results.length-1; return; }
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(i<=consumed) continue;
      const n=parseNum(e.results[i][0].transcript);
      if(n!==null){ consumed=i; answer(n); if(!running) return; }
    }
  };
  rec.onend=()=>{ if(running) startRec(); };
  rec.onerror=e=>{
    if(e.error!=="no-speech"&&e.error!=="aborted"){
      running=false; show("start"); menuMusic();
      document.getElementById("err").textContent="Speech recognition error: "+e.error;
    }
  };
  }
  pairs=Array.from({length:PAIRS},()=>makePair(opts, speed?1:undefined));
  document.body.classList.toggle("speedPlay", speed);
  answers=[]; taps=[]; cur=0; correct=0; running=true; ready=false;
  const cvs=[document.getElementById("L"),document.getElementById("R")];
  const ansRows=[document.getElementById("bigAns")];
  cvs.forEach(c=>c.style.visibility="hidden");
  ansRows.forEach(r=>r.style.visibility="hidden");
  show("play");
  if(rec) setTimeout(()=>{ if(running) startRec(); }, FADE_MS);
  const cds=document.querySelectorAll("#play .cd"), step=ALIGN_MS/3;
  const setCd=t=>cds.forEach(d=>d.textContent=t);
  setCd("2");
  setTimeout(()=>{ if(running) setCd("1"); }, step);
  setTimeout(()=>{ if(running) setCd("Go!"); }, step*2);
  setTimeout(()=>{
    setCd("");
    if(!running) return;
    showPair();
    cvs.forEach(c=>c.style.visibility="visible");
    if(!speed && btnChk.checked) ansRows.forEach(r=>r.style.visibility="visible");
    ready=true;
    t0=performance.now();
  },ALIGN_MS);
}
</script>
</body>
</html>
